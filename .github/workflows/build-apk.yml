name: Build Live IPTV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create signing config
        run: |
          echo "android.keystorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> local.properties
          echo "android.keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> local.properties
          echo "android.keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> local.properties

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --dart-define=BUILD_MODE=release \
            --split-per-abi \
            --obfuscate \
            --no-tree-shake-icons
