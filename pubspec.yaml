name: iptv_player
description: Live IPTV Streaming Android APK
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'   # Matches current Flutter 3.24.5 + Dart 3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  http: ^1.2.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  better_player: ^1.22.0   # Latest version (2026) - fully compatible
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
